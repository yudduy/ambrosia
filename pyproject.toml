[project]
name = "ambrosia-health"
version = "0.1.0"
description = "A private, local-first personal health dashboard and AI coach."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.3,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "mcp>=1.13,<2",
  "numpy>=2.3,<3",
  "orjson>=3.11,<4",
  "pillow>=11.3,<13",
  "pyarrow>=21,<23",
  "pydantic-settings>=2.10,<3",
  "pytz>=2025.2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
]

[project.scripts]
ambrosia = "ambrosia.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ambrosia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["ambrosia"]
